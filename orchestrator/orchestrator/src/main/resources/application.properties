spring.application.name=orchestrator

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:21432/orchestratordb
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:21092

saga.step-timeout=30s
saga.poller.interval=5s
saga.poller.batch-size=100
saga.poller.max-attempts=5
saga.reconciler.interval=30s
saga.reconciler.stale-after=60s
saga.reconciler.batch-size=100

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=orchestrator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.service.orchestrator.dto.SagaReply
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.listener.concurrency=3